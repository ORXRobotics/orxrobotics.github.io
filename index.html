<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORX HQ Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --lead-dark: #020C12;
            --deep-teal: #0B435B;
            --robotic-red: #CC312D;
            --stark-white: #F8FAFC;
            --steel-gray: #94A3B8;
            --grid-line: rgba(148, 163, 184, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            background-color: var(--lead-dark);
            color: var(--stark-white);
            line-height: 1.6;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 680px; 
            width: 100%;
        }

        /* Top 4pt Red Branding Line */
        .brand-line {
            height: 4px;
            background-color: var(--robotic-red);
            width: 100%;
            margin-bottom: 40px;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--deep-teal);
            margin: 0 0 10px 0;
        }

        h1 span {
            color: var(--robotic-red);
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--deep-teal);
            margin-top: 50px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--grid-line);
            padding-bottom: 8px;
        }

        p {
            font-size: 1rem;
            margin: 0 0 20px 0;
            color: rgba(248, 250, 252, 0.9);
        }

        form {
            border: 1px solid var(--steel-gray);
            border-radius: 0px;
            padding: 30px;
            background-color: rgba(11, 67, 91, 0.1); /* Subtle Teal tint */
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--steel-gray);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--lead-dark);
            border: 1px solid var(--steel-gray);
            border-radius: 0px;
            color: var(--stark-white);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--stark-white);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        /* Highlight Action Button */
        button {
            background-color: var(--robotic-red);
            color: var(--stark-white);
            border: none;
            border-radius: 2px;
            padding: 14px 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid var(--grid-line);
            text-align: center;
            font-size: 0.9rem;
        }

        .footer-brand {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            color: var(--deep-teal);
        }

        .footer-brand span {
            color: var(--robotic-red);
        }

        .footer-tagline {
            font-size: 0.85rem;
            color: var(--steel-gray);
            margin: 8px 0 24px 0;
        }

        .footer-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .footer-nav a {
            color: var(--stark-white);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-nav a:hover {
            color: var(--robotic-red);
        }

        .footer-copyright {
            font-size: 0.8rem;
            color: var(--steel-gray);
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-line"></div>

    <header>
        <h1>OR<span>X</span> HQ</h1>
    </header>

    <h2>Contact</h2>
    <p>Want to build with us, mentor a sub-team, or just ask a question? Send us a note below and someone from ORX will get back to you.</p>

    <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="efd25ce7-2310-4f43-86da-228c8fe00d11">
        <input type="checkbox" name="botcheck" style="display: none;">

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="focus">Focus Area</label>
            <select id="focus" name="area_of_interest" required>
                <option value="" disabled selected>Select an area...</option>
                <option value="CAD & Mechanical">CAD & Open-Source Part Libraries</option>
                <option value="Software">Software & Tools</option>
                <option value="Electrical">Electrical Engineering</option>
                <option value="Documentation">Technical Documentation</option>
                <option value="Communications">Outreach & Communications</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Details</label>
            <textarea id="notes" name="background_brief" required placeholder="Tell us a bit about yourself — past projects, relevant experience, or what you're hoping to help with. Rather send files directly? Just say so and we'll follow up by email."></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>

    <footer>
        <div class="footer-brand">OR<span>X</span> ROBOTICS</div>
        <p class="footer-tagline">Building the tools our community races on.</p>

        <nav class="footer-nav">
            <a href="index.html">Home</a>
            <a href="field.html">Beeline</a>
            <a href="downloads/index.html">Downloads</a>
            <a href="https://github.com/orxrobotics" target="_blank" rel="noopener">GitHub</a>
        </nav>

        <p class="footer-copyright">&copy; <span id="footer-year">2026</span> ORX Robotics. All rights reserved.</p>
    </footer>
</div>

<script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
</script>

</body>
</html>
